name: Release Plugin
run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release request
        env:
          VERSION: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "::error::Pre-release does not trigger plugin publish"
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9].*'; then
            echo "::error::Version must match ^v[0-9].*"
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag points to default branch
        env:
          VERSION: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
        run: |
          set -euo pipefail

          git fetch --force origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --force --tags origin

          if ! git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION does not exist locally after fetch"
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$VERSION")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag $VERSION is not on origin/$DEFAULT_BRANCH"
            exit 1
          fi

      - name: Validate versions match tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          PLUGIN_VERSION="$(python3 - <<'PY'
          import ast

          module = ast.parse(open("plugin.py").read())
          print(
              next(
                  ast.literal_eval(node.value)
                  for node in module.body
                  if isinstance(node, ast.Assign)
                  and any(
                      isinstance(target, ast.Name) and target.id == "VERSION"
                      for target in node.targets
                  )
              )
          )
          PY
          )"

          if [ "$MANIFEST_VERSION" != "$VERSION" ] || [ "$PLUGIN_VERSION" != "$VERSION" ]; then
            echo "::error::version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION plugin=$PLUGIN_VERSION"
            exit 1
          fi

      - name: Build plugin zip
        id: build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          ZIP_NAME="sakuramedia_judge_collecttion_movie-${VERSION#v}.zip"
          zip -r "$ZIP_NAME" . \
            -x '.git/*' -x 'tests/*' -x '__pycache__/*' -x '.venv/*' \
            -x '.pytest_cache/*' -x 'data/*' -x '.github/*'
          echo "artifact=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.artifact }}"
